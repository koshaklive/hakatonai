# Anchors: if a query matches any pattern, the listed points are forced into the context (max ANCHOR_MAX).
# Points must exist in the indexed version (unknown ones are skipped with a warning). Edit freely; no code changes needed.
anchors:
  - name: review_deadline          # срок рассмотрения/согласования зависит от вида документа
    patterns:
      - "срок\\w*.{0,40}(рассмотр|согласован|визир)"
      - "(рассмотр|согласован|визир)\\w*.{0,40}срок"
      - "за сколько.{0,30}(рассмотр|согласов|визир)"
    points: ["10.3"]
  - name: visa_order               # визирование = Матрица + порядок
    patterns: ["виз(а|ир|у|ы|ой)", "кто согласовывает", "согласующ"]
    points: ["10.6", "10.11"]
  - name: date_rule                # «до» не включает дату, «не позднее» включает
    patterns: ["\\bдо\\s+\\d{1,2}\\s+[а-я]+", "не позднее", "включа\\w+\\s+(ли\\s+)?дат", "последний день срока"]
    points: ["6.4"]
