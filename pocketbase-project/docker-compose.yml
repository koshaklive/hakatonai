version: "3.8"
services:
  pocketbase:
    build: .
    container_name: pb_rag_assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://fastapi:8000}