topics:
  срок:
    search_term: срок рассмотрения
    patterns:
      - '\bсрок\w*\b'
    required_slots:
      - вид_документа
  визирование:
    search_term: визирование
    patterns:
      - '\bвизир\w*\b'
      - '\bсогласовани\w*\b'
    required_slots:
      - вид_документа
  пояснительная_записка:
    search_term: пояснительная записка
    patterns:
      - '\bпояснительн\w*\s+записк\w*\b'
    required_slots:
      - объем_страниц
  адресат:
    search_term: адресат
    patterns:
      - '\bадресат\w*\b'
      - '\bкому\s+(?:направить|адресовать)\b'
    required_slots:
      - вид_документа
  хранение:
    search_term: хранение документов
    patterns:
      - '\bхранени\w*\b'
      - '\bхранить\b'
    required_slots:
      - вид_документа

slots:
  вид_документа:
    values:
      распоряжение:
        - '\bраспоряж\w*\b'
      приказ:
        - '\bприказ\w*\b'
      письмо:
        - '\bписьм\w*\b'
      служебная записка:
        - '\bслужебн\w*\s+записк\w*\b'
      пояснительная записка:
        - '\bпояснительн\w*\s+записк\w*\b'
      протокол:
        - '\bпротокол\w*\b'
      акт:
        - '\bакт\w*\b'
      договор:
        - '\bдоговор\w*\b'
      заявление:
        - '\bзаявлени\w*\b'
      инструкция:
        - '\bинструкци\w*\b'
  объем_страниц:
    values:
      pattern: '(\d+)\s*(?:страниц\w*|стр\.?|лист\w*)'
