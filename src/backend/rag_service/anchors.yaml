anchors:
  - name: review_deadline
    patterns:
      - "срок\\w*.{0,40}(рассмотр|согласован|визир)"
      - "(рассмотр|согласован|визир)\\w*.{0,40}срок"
      - "за сколько.{0,30}(рассмотр|согласов|визир)"
    points: ["10.3"]
  - name: visa_orders
    limit: 6
    patterns:
      - "(виз\\w*|согласующ\\w*|согласовыва\\w*).{0,80}приказ"
      - "приказ.{0,80}(виз\\w*|согласующ\\w*|согласовыва\\w*)"
    points: ["10.6", "MTX.int.[1-4]", "10.11"]
  - name: visa_dispositions
    limit: 6
    patterns:
      - "(виз\\w*|согласующ\\w*|согласовыва\\w*).{0,80}распоряжен"
      - "распоряжен.{0,80}(виз\\w*|согласующ\\w*|согласовыва\\w*)"
    points: ["10.6", "MTX.int.[5-7]", "10.11"]
  - name: visa_letters
    limit: 6
    patterns:
      - "(виз\\w*|согласующ\\w*|согласовыва\\w*).{0,80}письм"
      - "письм.{0,80}(виз\\w*|согласующ\\w*|согласовыва\\w*)"
    points: ["10.6", "MTX.ext.*", "10.11"]
  - name: visa_generic
    limit: 4
    patterns: ["виз(а|ир|у|ы|ой)", "кто согласовывает", "согласующ", "матриц\\w*\\s+визир"]
    points: ["10.6", "10.11", "MTX.*"]
  - name: date_rule
    patterns: ["\\bдо\\s+\\d{1,2}\\s+[а-я]+", "не позднее", "включа\\w+\\s+(ли\\s+)?дат", "последний день срока"]
    points: ["6.4"]